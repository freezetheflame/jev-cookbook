name: Validate cookbook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test demo/converter.test.cjs
      - run: python demo/check_schema.py
