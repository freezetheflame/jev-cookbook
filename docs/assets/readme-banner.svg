<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jev Cookbook — Practical recipes for typed decisions</title>
  <desc id="desc">Three request ingredients: state for evidence, questions for decisions, and criteria for boundaries.</desc>
  <rect width="1200" height="360" rx="24" fill="#f1f4eb"/>
  <path d="M0 285H1200M0 305H1200M0 325H1200" stroke="#e3e9dc"/>
  <rect x="44" y="43" width="1112" height="274" rx="16" fill="#f9fbf5" stroke="#d6e0cf"/>
  <rect x="44" y="43" width="7" height="274" rx="3" fill="#245e49"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="83" y="91" fill="#6a806b" font-size="12" letter-spacing="3">FROM A QUESTION TO A TYPED DECISION</text>
    <text x="80" y="160" fill="#234d3c" font-size="56" font-weight="700" letter-spacing="-2">Jev Cookbook</text>
    <text x="83" y="200" fill="#647a68" font-size="18">Practical recipes. Explicit boundaries.</text>
    <text x="83" y="227" fill="#647a68" font-size="18">Requests you can inspect and adapt.</text>
    <rect x="83" y="256" width="125" height="28" rx="14" fill="#e3eddc"/>
    <text x="145" y="275" text-anchor="middle" fill="#426447" font-size="11" letter-spacing="1">RECIPES + DEMO</text>
    <g transform="translate(694 75)">
      <rect width="422" height="62" rx="10" fill="#eaf0e2" stroke="#d6e0cb"/>
      <text x="20" y="38" font-family="Consolas, monospace" fill="#31573e" font-size="20">state</text>
      <text x="399" y="37" text-anchor="end" fill="#728368" font-size="14">The evidence</text>
      <rect y="78" width="422" height="62" rx="10" fill="#deead9" stroke="#cdddc5"/>
      <text x="20" y="116" font-family="Consolas, monospace" fill="#31573e" font-size="20">questions</text>
      <text x="399" y="115" text-anchor="end" fill="#657e5e" font-size="14">The decisions</text>
      <rect y="156" width="422" height="62" rx="10" fill="#245e49"/>
      <text x="20" y="194" font-family="Consolas, monospace" fill="#f0f5e9" font-size="20">criteria</text>
      <text x="399" y="193" text-anchor="end" fill="#bed4bf" font-size="14">The boundaries</text>
    </g>
  </g>
</svg>
